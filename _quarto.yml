project:
  type: website
  output-dir: docs
  resources:
    - images/
    - files/

website:
  title: "W-MIC Study"
  description: "The Wellbeing Multi-Instrument Comparison Study"
  favicon: images/WMIC_logo.png

  navbar:
    background: primary
    pinned: true
    logo: images/WMIC_logo.png
    logo-alt: "W-MIC"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Project"
        href: project.qmd
      - text: "Team"
        href: team/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Resources"
        href: resources/index.qmd
      - text: "News"
        href: news/index.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/A-DePalma/WMIC
        aria-label: GitHub

  page-footer:
    left: "© 2026 W-MIC Project"
    right:
      - text: "GitHub"
        href: https://github.com/A-DePalma/WMIC

  open-graph: true

format:
  html:
    theme:
      light: [flatly, custom.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
